[build-system]
requires = ["setuptools>=77.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asr-concurrent-stream"
version = "1.0.0"
description = "Concurrent streaming gRPC server and client for Qwen3-ASR"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Alibaba Qwen Team" }]
keywords = ["asr", "speech-recognition", "grpc", "streaming", "qwen3"]

dependencies = [
    "grpcio",
    "numpy",
    "protobuf",
    "vllm",
    "transformers",
]

[project.optional-dependencies]
client = [
    "soundfile",
    "torch",
]
dev = [
    "grpcio-tools",
]

[project.scripts]
asr-concurrent-server = "server._launch_server:main"
asr-concurrent-client = "client.example_client:main"

[project.urls]
Homepage = "https://github.com/Qwen/Qwen3-ASR"

[tool.setuptools]
packages = ["proto", "server", "client"]
